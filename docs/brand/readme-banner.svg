<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="iFranchise HRMS">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220">
        <animate attributeName="stop-color" values="#0B1220;#101A2E;#0B1220" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#12263F">
        <animate attributeName="stop-color" values="#12263F;#1A3354;#12263F" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0E3B3A">
        <animate attributeName="stop-color" values="#0E3B3A;#14524F;#0E3B3A" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="930" cy="150" r="120" fill="url(#glow)" filter="url(#soft)">
    <animate attributeName="r" values="110;130;110" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;1;0.85" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Orbit ring -->
  <g transform="translate(930 150)" opacity="0.9">
    <circle r="78" fill="none" stroke="#2DD4BF" stroke-opacity="0.25" stroke-width="1.5"/>
    <circle r="4" fill="#38BDF8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      <animateMotion dur="9s" repeatCount="indefinite" path="M 78 0 A 78 78 0 1 1 77.9 0"/>
    </circle>
    <circle r="3" fill="#2DD4BF">
      <animateMotion dur="6s" repeatCount="indefinite" path="M 0 -56 A 56 56 0 1 1 -0.1 -56"/>
    </circle>
  </g>

  <!-- Hex pulse -->
  <g transform="translate(930 150)" fill="none" stroke="url(#accent)" stroke-width="2">
    <path d="M0,-34 L29,-17 L29,17 L0,34 L-29,17 L-29,-17 Z" opacity="0.9">
      <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="3.2s" repeatCount="indefinite"/>
    </path>
    <path d="M0,-18 L16,-9 L16,9 L0,18 L-16,9 L-16,-9 Z" opacity="0.55">
      <animate attributeName="opacity" values="0.35;0.8;0.35" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="72" y="128" fill="#F8FAFC" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700">iFranchise HRMS</text>
  <text x="72" y="178" fill="#94A3B8" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="22">Enterprise workforce platform</text>

  <rect x="72" y="214" width="188" height="36" rx="18" fill="#0F172A" stroke="#2DD4BF" stroke-opacity="0.45"/>
  <circle cx="94" cy="232" r="5" fill="#34D399">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="110" y="238" fill="#E2E8F0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Live · Secure · Scalable</text>

  <text x="72" y="300" fill="#64748B" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15">Next.js 15 · Supabase · Role-based portals</text>
</svg>
